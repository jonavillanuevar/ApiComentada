# Puerto donde escuchara la API.
server.port=8091

# Motor de base de datos usado por JPA.
spring.jpa.database=MYSQL

# Driver JDBC de MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conexion a la base de datos existente.
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia_2026_dsw_ii_rest?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql

# Indica que los mensajes externos de validacion se encuentran
# en src/main/resources/validaciones.properties.
spring.messages.basename=validaciones
